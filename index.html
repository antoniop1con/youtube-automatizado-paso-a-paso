<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>YouTube automatizado · paso a paso</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f6f3ee; --panel:#ffffff; --panel2:#faf8f4; --panel3:#f0ece3;
  --linea:#e9e3d8; --linea2:#dcd3c2; --texto:#211d17; --suave:#736a5a; --tenue:#a89d89;
  --acento:#d9552d; --acento2:#b8441f; --acento3:#ffb088; --acento-suave:rgba(217,85,45,.11);
  --ok:#2f8f52; --ok-suave:rgba(47,143,82,.12);
  --aviso:#a8760a; --aviso-suave:rgba(184,134,10,.13);
  --mal:#c23b3b; --mal-suave:rgba(194,59,59,.11);
  --sombra-sm:0 1px 2px rgba(30,20,10,.04);
  --sombra:0 1px 2px rgba(30,20,10,.05), 0 8px 20px -10px rgba(30,20,10,.14);
  --sombra-lg:0 20px 60px -20px rgba(20,14,8,.28), 0 4px 16px -6px rgba(20,14,8,.1);
  --r:16px; --r-sm:10px; --r-lg:22px;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){ :root:not([data-theme="light"]){
  --bg:#16140f; --panel:#1e1c17; --panel2:#25221c; --panel3:#2c2822;
  --linea:#38332a; --linea2:#463f33; --texto:#f4efe4; --suave:#ab9f8b; --tenue:#756a58;
  --acento:#ff8258; --acento2:#ffa07c; --acento3:#7a3b23; --acento-suave:rgba(255,130,88,.15);
  --ok:#5cca86; --ok-suave:rgba(92,202,134,.13);
  --aviso:#e6b643; --aviso-suave:rgba(230,182,67,.13);
  --mal:#ff6b6b; --mal-suave:rgba(255,107,107,.13);
  --sombra:0 1px 2px rgba(0,0,0,.3), 0 8px 22px -10px rgba(0,0,0,.45);
  --sombra-lg:0 24px 70px -18px rgba(0,0,0,.6), 0 4px 18px -4px rgba(0,0,0,.35);
  color-scheme:dark;
}}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{margin:0;background:
    radial-gradient(1100px 560px at 12% -8%, var(--acento-suave), transparent 58%),
    var(--bg);
  color:var(--texto);
  font:14.5px/1.6 'Inter',ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;
  -webkit-font-smoothing:antialiased}
h1,h2,h3{font-family:'Inter',sans-serif;letter-spacing:-.015em}
button,input,select,textarea{font:inherit;color:inherit}
button{border:1px solid var(--linea2);background:var(--panel);padding:10px 17px;
  border-radius:var(--r-sm);cursor:pointer;font-weight:600;font-size:13.5px;
  display:inline-flex;align-items:center;gap:7px;
  transition:border-color .15s,background .15s,box-shadow .15s,transform .08s}
button:hover:not(:disabled){border-color:var(--tenue);box-shadow:var(--sombra)}
button:active:not(:disabled){transform:scale(.97)}
button:disabled{opacity:.42;cursor:default}
button.p{background:linear-gradient(180deg,var(--acento),var(--acento2));
  border:1px solid var(--acento2);color:#fff;
  box-shadow:0 1px 1px rgba(0,0,0,.08),0 10px 22px -10px color-mix(in srgb,var(--acento) 65%,transparent)}
button.p:hover:not(:disabled){filter:brightness(1.07)}
button.sm{padding:6px 12px;font-size:12.5px;border-radius:8px}
button svg{width:15px;height:15px;flex:none}
input,textarea,select{width:100%;padding:10px 13px;border:1px solid var(--linea2);
  border-radius:var(--r-sm);background:var(--panel2);resize:vertical}
input:focus,textarea:focus,select:focus{outline:none;border-color:var(--acento);
  box-shadow:0 0 0 3px var(--acento-suave)}
label{font-size:10.5px;text-transform:uppercase;letter-spacing:.08em;color:var(--suave);
  font-weight:700;display:block;margin-bottom:7px}
::-webkit-scrollbar{width:9px;height:9px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--linea2);border-radius:99px;border:2px solid transparent;background-clip:padding-box}

/* --------------------------------------------------- estructura general */
.app-shell{height:100vh;display:flex}
.side{width:270px;flex:none;background:var(--panel);border-right:1px solid var(--linea);
  display:flex;flex-direction:column}
.marca{display:flex;align-items:center;gap:10px;padding:22px 20px 18px}
.marca .icono{width:34px;height:34px;flex:none;border-radius:10px;
  background:linear-gradient(160deg,var(--acento),var(--acento2));
  display:flex;align-items:center;justify-content:center;box-shadow:var(--sombra)}
.marca .icono svg{width:19px;height:19px;color:#fff}
.marca .txt{font-weight:800;font-size:14.5px;line-height:1.25}
.marca .txt span{display:block;font-size:10.5px;font-weight:700;color:var(--suave);
  text-transform:uppercase;letter-spacing:.08em}

.proyecto-caja{margin:0 16px 18px;padding:14px;background:var(--panel2);
  border:1px solid var(--linea);border-radius:var(--r-sm)}
.proyecto-caja label{margin-bottom:6px}
#inpTitulo{background:var(--panel);font-weight:700;font-size:14px;padding:8px 10px}
#selProyecto{margin-top:8px;font-size:12.5px;padding:7px 9px}
.gasto-linea{display:flex;align-items:center;justify-content:space-between;margin-top:10px;
  font-size:12px;color:var(--suave)}
.gasto-linea b{color:var(--texto);font-size:13px}
.pulso{width:7px;height:7px;border-radius:99px;background:var(--ok);flex:none}
.pulso.trabajando{background:var(--acento);animation:pulso 1.1s ease-in-out infinite}
@keyframes pulso{0%,100%{opacity:1;box-shadow:0 0 0 0 var(--acento-suave)}
  50%{opacity:.65;box-shadow:0 0 0 5px transparent}}

nav#nav{flex:1;overflow-y:auto;padding:4px 14px 16px}
.paso-nav{position:relative;display:flex;align-items:center;gap:12px;padding:11px 10px;
  border-radius:var(--r-sm);cursor:pointer;color:var(--suave);font-size:13.5px;font-weight:600;
  transition:background .15s,color .15s}
.paso-nav:hover{background:var(--panel2);color:var(--texto)}
.paso-nav.activo{background:var(--acento-suave);color:var(--texto)}
.paso-nav.hecho{color:var(--ok)}
.paso-nav .n{width:28px;height:28px;border-radius:9px;border:1.5px solid var(--linea2);
  display:flex;align-items:center;justify-content:center;flex:none;
  background:var(--panel);z-index:1;color:var(--tenue)}
.paso-nav .n svg{width:14px;height:14px}
.paso-nav.hecho .n{background:var(--ok);border-color:var(--ok);color:#fff}
.paso-nav.activo .n{background:var(--acento);border-color:var(--acento);color:#fff}
.paso-nav:not(:last-child)::after{content:'';position:absolute;left:24px;top:40px;width:1.5px;
  height:16px;background:var(--linea2)}
.paso-nav.hecho:not(:last-child)::after{background:var(--ok)}

.main{flex:1;overflow-y:auto;padding:42px 48px 80px}
.wrap{max-width:740px}
.cabecera-paso{display:flex;align-items:flex-start;gap:14px;margin-bottom:28px}
.cabecera-paso .ic{width:42px;height:42px;flex:none;border-radius:12px;background:var(--acento-suave);
  color:var(--acento);display:flex;align-items:center;justify-content:center}
.cabecera-paso .ic svg{width:21px;height:21px}
.wrap h2{font-size:24px;margin:0 0 4px;font-weight:800}
.wrap .sub{color:var(--suave);margin:0;font-size:14px;max-width:52ch}

.card{background:var(--panel);border:1px solid var(--linea);border-radius:var(--r-lg);
  padding:24px;margin-bottom:18px;box-shadow:var(--sombra-sm)}
.card.destacada{border-color:var(--acento);box-shadow:0 0 0 3px var(--acento-suave)}
.fila{display:flex;gap:10px;align-items:center}
.fila.entre{justify-content:space-between}
.chip{display:inline-flex;align-items:center;gap:6px;padding:5px 11px;border-radius:99px;
  font-size:12px;font-weight:700;background:var(--panel3);color:var(--suave)}
.chip.ok{background:var(--ok-suave);color:var(--ok)}
.chip.mal{background:var(--acento-suave);color:var(--acento)}
.nota-grande{font-size:36px;font-weight:800;line-height:1;font-variant-numeric:tabular-nums}
.nota-grande.ok{color:var(--ok)}
.nota-grande.reg{color:var(--aviso)}
.nota-grande.mal{color:var(--mal)}
.elemento-ref{display:flex;flex-direction:column;gap:8px;border:1px solid var(--linea);
  border-radius:14px;padding:14px;margin-bottom:10px;transition:border-color .15s,box-shadow .15s}
.elemento-ref:hover{border-color:var(--linea2);box-shadow:var(--sombra-sm)}
.elemento-ref .cab{display:flex;gap:14px;align-items:center}
.elemento-ref img{width:60px;height:60px;object-fit:contain;background:#fff;border-radius:10px;
  border:1px solid var(--linea)}
details summary{cursor:pointer;font-size:12px;color:var(--suave);font-weight:700;user-select:none}
details summary:hover{color:var(--texto)}
textarea.prompt{font-size:12px;min-height:80px}
.miniaturas{display:grid;grid-template-columns:1fr 1fr;gap:18px}
.miniaturas img{width:100%;border-radius:14px;border:1px solid var(--linea)}
.avisos{position:fixed;top:22px;right:22px;display:flex;flex-direction:column;gap:8px;z-index:50}
.aviso{background:var(--texto);color:var(--bg);padding:11px 18px;border-radius:11px;font-size:13px;
  font-weight:600;box-shadow:var(--sombra-lg);animation:entra .25s ease}
@keyframes entra{from{opacity:0;transform:translateY(-6px)}to{opacity:1;transform:none}}
.barra{position:relative;height:8px;border-radius:99px;background:var(--panel3);overflow:hidden;margin:14px 0}
.barra i{display:block;height:100%;background:linear-gradient(90deg,var(--acento),var(--acento2));
  transition:width .4s ease;position:relative}
.barra i::after{content:'';position:absolute;inset:0;
  background:linear-gradient(90deg,transparent,rgba(255,255,255,.4),transparent);
  width:60px;animation:brillo 1.4s linear infinite}
@keyframes brillo{from{transform:translateX(-80px)}to{transform:translateX(240px)}}
.log{font-size:12px;color:var(--suave);white-space:pre-wrap;max-height:160px;overflow-y:auto;
  background:var(--panel2);border-radius:12px;padding:13px;font-family:ui-monospace,'SF Mono',monospace;
  border:1px solid var(--linea);line-height:1.7}
.log .ultimo{color:var(--texto);font-weight:700}
video{width:100%;border-radius:14px;box-shadow:var(--sombra)}
.vacio{text-align:center;padding:44px 20px;color:var(--suave)}
.vacio svg{width:40px;height:40px;color:var(--tenue);margin-bottom:10px}

.rejilla-planos{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
.plano-card{background:var(--panel);border:1px solid var(--linea);border-radius:12px;overflow:hidden;
  transition:border-color .15s,box-shadow .15s}
.plano-card:hover{border-color:var(--linea2);box-shadow:var(--sombra-sm)}
.plano-card .lienzo{position:relative;aspect-ratio:16/9;background:var(--panel3);
  display:flex;align-items:center;justify-content:center}
.plano-card .lienzo img{width:100%;height:100%;object-fit:cover;display:block}
.plano-card .sin-img{font-size:10.5px;color:var(--tenue);text-align:center;padding:0 8px}
.plano-card .tag{position:absolute;top:6px;left:6px;background:rgba(0,0,0,.55);color:#fff;
  font-size:10px;font-weight:700;padding:2px 6px;border-radius:6px;backdrop-filter:blur(2px)}
.plano-card .tag.alerta{left:auto;right:6px;background:var(--mal)}
.pie-plano{font-size:11.5px;color:var(--suave);padding:8px 10px;line-height:1.4;
  display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
</style>
</head>
<body>

<div class="app-shell">
  <div class="side">
    <div class="marca">
      <span class="icono"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
        stroke-linecap="round" stroke-linejoin="round"><polygon points="6 4 20 12 6 20 6 4"/></svg></span>
      <span class="txt">YouTube automatizado<span>Paso a paso</span></span>
    </div>
    <div class="proyecto-caja">
      <label>Título del proyecto</label>
      <input id="inpTitulo" placeholder="Sin título" onchange="ponerTitulo(this.value)">
      <select id="selProyecto" onchange="cambiarProyecto(this.value)"></select>
      <div class="gasto-linea">
        <span><span class="pulso" id="pulso"></span> <span id="txtPulso">al día</span></span>
        <b id="chipGasto">0,00 €</b>
      </div>
    </div>
    <nav id="nav"></nav>
  </div>
  <div class="main"><div class="wrap" id="contenido"></div></div>
</div>

<div class="avisos" id="avisos"></div>

<script>
const SVG = (d) => `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
  stroke-linecap="round" stroke-linejoin="round">${d}</svg>`;
const ICONOS = {
  guion: SVG('<path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/>'),
  referencias: SVG('<rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="9" cy="9" r="2"/><path d="m21 15-3.1-3.1a2 2 0 0 0-2.8 0L6 21"/>'),
  imagenes: SVG('<rect x="3" y="3" width="18" height="18" rx="3"/><circle cx="8.5" cy="8.5" r="1.5"/><path d="m3 16 5-5c.8-.8 2.2-.8 3 0l5 5"/><path d="m14 15 1-1c.8-.8 2.2-.8 3 0l3 3"/>'),
  voz: SVG('<rect x="9" y="2" width="6" height="12" rx="3"/><path d="M5 10a7 7 0 0 0 14 0"/><line x1="12" y1="19" x2="12" y2="22"/>'),
  montaje: SVG('<rect x="2" y="6" width="20" height="14" rx="2"/><path d="m2 6 3.5 4M8 6l3.5 4M14 6l3.5 4"/>'),
  seo: SVG('<path d="M3 11v2a1 1 0 0 0 1 1h2l4 4V6L6 10H4a1 1 0 0 0-1 1z"/><path d="M17 8a5 5 0 0 1 0 8"/>'),
  miniatura: SVG('<rect x="2" y="4" width="20" height="16" rx="2"/><circle cx="9" cy="10" r="2"/><path d="m3 17 4.5-4.5c.7-.7 1.8-.7 2.5 0L15 18"/><path d="m13 16 2-2c.7-.7 1.8-.7 2.5 0L21 17"/>'),
  formato: SVG('<circle cx="12" cy="12" r="10"/><polygon points="10 8 16 12 10 16 10 8"/>'),
};
const PASOS = [
  {id:'formato',     titulo:'Formato de referencia'},
  {id:'guion',       titulo:'Guion'},
  {id:'referencias', titulo:'Referencias'},
  {id:'imagenes',    titulo:'Imágenes'},
  {id:'voz',         titulo:'Voz'},
  {id:'montaje',     titulo:'Montaje'},
  {id:'seo',         titulo:'Título y descripción'},
  {id:'miniatura',   titulo:'Miniatura'},
];
let PASO = 0, ESTADO = null, TRABAJANDO = false;

const $ = s => document.querySelector(s);
const esc = s => (s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

function avisar(m){
  const d=document.createElement('div'); d.className='aviso'; d.textContent=m;
  avisos.appendChild(d); setTimeout(()=>d.remove(),3000);
}
async function api(url, body){
  const r = await fetch(url,{method:'POST',headers:{'Content-Type':'application/json'},
    body: body?JSON.stringify(body):'{}'});
  const j = await r.json().catch(()=>({}));
  if(!r.ok) avisar(j.mensaje || j.error || 'Error');
  await refrescar();
  return {ok:r.ok, ...j};
}
async function get(url){
  const r = await fetch(url);
  if(!r.ok) return {__error: (await r.json().catch(()=>({}))).error || r.status};
  return r.json();
}
function notaClase(n){ return n>=80?'ok':n>=50?'reg':'mal'; }
function cabecera(id, titulo, sub){
  return `<div class="cabecera-paso">
    <span class="ic">${ICONOS[id]}</span>
    <div><h2>${titulo}</h2><p class="sub">${sub}</p></div>
  </div>`;
}

function pintarNav(){
  const CHECK = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>';
  nav.innerHTML = PASOS.map((p,i)=>`
    <div class="paso-nav ${i===PASO?'activo':''} ${i<PASO?'hecho':''}" onclick="irA(${i})">
      <span class="n">${i<PASO?CHECK:ICONOS[p.id]}</span> ${p.titulo}
    </div>`).join('');
  chipGasto.textContent = `${(ESTADO?.resumen?.gasto_total||0).toFixed(2)} €`;
  pulso.className = 'pulso' + (TRABAJANDO?' trabajando':'');
  txtPulso.textContent = TRABAJANDO ? (ESTADO?.trabajo?.tarea||'trabajando') : 'al día';
  if(document.activeElement !== inpTitulo) inpTitulo.value = ESTADO?.titulo || '';
}
function irA(i){ PASO=i; render(); }

async function ponerTitulo(t){
  await fetch('/api/titulo',{method:'POST',headers:{'Content-Type':'application/json'},
    body:JSON.stringify({titulo:t})});
  await cargarProyectos();
  avisar('Título guardado');
}

async function cargarProyectos(){
  const d = await get('/api/proyectos');
  selProyecto.innerHTML = (d.proyectos||[]).map(p=>
    `<option value="${esc(p.nombre)}" ${p.activo?'selected':''}>${esc(p.titulo)}</option>`
  ).join('') || '<option>(sin proyectos)</option>';
}
async function cambiarProyecto(nombre){
  await fetch('/api/proyectos/activar',{method:'POST',headers:{'Content-Type':'application/json'},
    body:JSON.stringify({nombre})});
  PASO = 0; await refrescar(); render();
}

async function refrescar(){
  const antes = TRABAJANDO;
  ESTADO = await get('/api/estado');
  TRABAJANDO = ESTADO?.trabajo?.activo || false;
  pintarNav();
  if(TRABAJANDO){
    setTimeout(render, 1200);
  } else if(antes){
    // acaba de terminar un trabajo: hay que repintar el contenido SI o SI,
    // si no la pantalla se queda congelada con la barra de progreso
    // (parecia que seguia "trabajando" aunque ya llevara rato terminado)
    avisar(`${ESTADO?.trabajo?.tarea || 'Trabajo'} terminado`);
    render();
  }
}

function barraTrabajo(){
  if(!TRABAJANDO) return '';
  const t = ESTADO.trabajo;
  const pct = t.total ? Math.min(100, Math.round(100*t.hecho/t.total)) : 4;
  const lineas = (t.log||[]).slice(-8).map(esc);
  const ultima = lineas.length ? lineas.pop() : '';
  return `<div class="card">
    <div class="fila entre"><b>${esc(t.tarea)}</b><span class="chip">${t.hecho}/${t.total||'?'}</span></div>
    <div class="barra"><i style="width:${pct}%"></i></div>
    <div class="log">${lineas.join('\n')}${lineas.length?'\n':''}<span class="ultimo">${ultima}</span></div>
    <div style="margin-top:10px"><button class="sm" onclick="api('/api/parar')">Detener</button></div>
  </div>`;
}

async function render(){
  pintarNav();
  const id = PASOS[PASO].id;
  contenido.innerHTML = '<p style="color:var(--suave)">Cargando…</p>';
  const html = await ({
    formato: pasoFormato, guion: pasoGuion, referencias: pasoReferencias, imagenes: pasoImagenes,
    voz: pasoVoz, montaje: pasoMontaje, seo: pasoSeo, miniatura: pasoMiniatura,
  })[id]();
  contenido.innerHTML = barraTrabajo() + html;
}

/* ---------------- paso 0: formato de referencia ---------------- */
async function pasoFormato(){
  const d = await get('/api/ideas');
  const ideas = (d.ideas||[]).filter(i=>(i.notas||'').includes('referencia de formato'));
  return cabecera('formato', 'Parte de un vídeo que ya funciona (opcional)',
      'Pega la URL de un vídeo de YouTube y, si quieres, su transcripción (los tres puntos bajo el vídeo → "Mostrar transcripción"). Analizo solo el FORMATO — número de bloques, ritmo, duración — nunca copio su contenido. Con eso te propongo ideas de tema distinto que encajen en esa misma estructura.') + `
    <div class="card">
      <label>URL del vídeo de YouTube</label>
      <input id="inpUrlRef" placeholder="https://www.youtube.com/watch?v=...">
      <label style="margin-top:14px">Transcripción (opcional, para analizar la estructura de verdad)</label>
      <textarea id="inpTranscripcion" style="min-height:140px" placeholder="Pega aquí la transcripción si la tienes..."></textarea>
      <div class="fila entre" style="margin-top:14px">
        <span class="chip">${ideas.length} idea(s) generada(s) hasta ahora</span>
        <button class="p" ${TRABAJANDO?'disabled':''} onclick="analizarReferencia()">Analizar y proponer ideas</button>
      </div>
    </div>
    ${ideas.length ? `
    <div class="card">
      <b>Ideas propuestas</b>
      <div style="margin-top:10px;display:flex;flex-direction:column;gap:10px">
        ${ideas.map((i)=>`
          <div style="border:1px solid var(--linea);border-radius:12px;padding:12px">
            <b>${esc(i.titulo)}</b>
            <p style="margin:6px 0 10px;color:var(--suave);font-size:13px">${esc(i.resumen)}</p>
            <button class="sm" ${TRABAJANDO?'disabled':''} onclick="usarIdea(${i.id})">Escribir el guion completo con esta idea</button>
          </div>`).join('')}
      </div>
    </div>` : ''}
    <div class="fila" style="margin-top:6px">
      <button class="sm" onclick="irA(1)">Prefiero escribir mi propio guion directamente →</button>
    </div>`;
}
async function analizarReferencia(){
  const url = inpUrlRef.value.trim();
  if(!url) return avisar('Pega una URL de YouTube primero');
  await api('/api/referencia_video', {url, transcripcion: inpTranscripcion.value});
}
async function usarIdea(idea_id){
  if(!confirm('¿Escribir el guion completo con esta idea? Es una llamada de texto, unos céntimos.')) return;
  const r = await fetch('/api/escribir_guion',{method:'POST',headers:{'Content-Type':'application/json'},
    body:JSON.stringify({idea_id})});
  if(!r.ok){ avisar('No se pudo lanzar la escritura del guion'); return; }
  await refrescar();
  // espera a que termine el trabajo (polling ya en marcha via refrescar/setInterval)
  while(TRABAJANDO){ await new Promise(res=>setTimeout(res,800)); }
  const d = await get('/api/escribir_guion');
  if(d.__error || !d.guion){ avisar('No se generó el guion, inténtalo de nuevo'); return; }
  PASO = 1; // paso guion
  await render();
  if(txtGuion) txtGuion.value = d.guion;
  avisar('Guion escrito, revísalo y crea el proyecto cuando quieras');
}

/* ---------------- paso 1: guion ---------------- */
async function pasoGuion(){
  const g = await get('/api/guion');
  const proy = ESTADO?.titulo || ESTADO?.proyecto || '';
  return cabecera('guion', 'Escribe o pega tu guion',
      proy ? `Proyecto activo: <b>${esc(proy)}</b>` : 'Todavía no hay ningún proyecto creado.') + `
    <div class="card">
      <label>Guion completo</label>
      <textarea id="txtGuion" style="min-height:280px">${esc(g.texto||'')}</textarea>
      <div class="fila entre" style="margin-top:14px">
        <span class="chip">${(g.texto||'').split(/\s+/).filter(Boolean).length} palabras</span>
        <button class="p" onclick="crearProyecto()" ${TRABAJANDO?'disabled':''}>Crear proyecto y analizar guion</button>
      </div>
    </div>`;
}
async function crearProyecto(){
  const texto = txtGuion.value.trim();
  if(!texto) return avisar('Pega un guion primero');
  const r = await api('/api/proyectos', {texto});
  if(r.ok){ avisar('Analizando guion…'); }
}

/* ---------------- paso 2: referencias ---------------- */
async function pasoReferencias(){
  const d = await get('/api/referencias');
  if(d.__error || !d.elementos) return cabecera('referencias','Referencias','Primero completa el paso 1 (guion).');
  if(!d.elementos.length) return cabecera('referencias','Referencias','Este guion no tiene personajes/objetos recurrentes que necesiten referencia.');
  const faltan = d.elementos.filter(e=>!e.existe).length;
  return cabecera('referencias', 'Sube una imagen por cada elemento',
      'La app no dibuja estos personajes/objetos por su cuenta: tú eliges o generas la imagen (Google Flow, ChatGPT…) y la subes aquí, así sale siempre igual en todo el vídeo.') + `
    ${d.paleta?.length ? `<div class="chip" style="margin-bottom:14px">🎨 ${esc(d.paleta.join(', '))}</div>` : ''}
    ${d.elementos.map((e,i)=>`
      <div class="elemento-ref">
        <div class="cab">
          <img src="/media/referencia/${encodeURIComponent(e.archivo)}?t=${Date.now()}" onerror="this.style.opacity=.15">
          <div style="flex:1;min-width:0">
            <b>${esc(e.nombre)}</b>
            <div style="font-size:12px;color:var(--suave)">${esc(e.descripcion)}</div>
          </div>
          <span class="chip ${e.existe?'ok':'mal'}">${e.existe?'lista':'falta'}</span>
          <label class="sm" style="cursor:pointer;border:1px solid var(--linea2);padding:6px 11px;border-radius:8px">
            Subir foto
            <input type="file" accept="image/*" style="display:none" onchange="subirRef('${esc(e.nombre)}',this.files[0])">
          </label>
        </div>
        <details><summary>Prompt exacto para generarla</summary>
          <div class="fila" style="margin-top:6px">
            <textarea class="prompt" readonly>${esc(e.prompt_referencia)}</textarea>
            <button class="sm" onclick="navigator.clipboard.writeText(${JSON.stringify(e.prompt_referencia)});avisar('Copiado')">Copiar</button>
          </div>
        </details>
      </div>`).join('')}
    <div class="fila entre" style="margin-top:10px">
      <span class="chip ${faltan?'mal':'ok'}">${faltan? faltan+' por subir' : 'todo listo'}</span>
    </div>`;
}
async function subirRef(nombre, file){
  if(!file) return;
  const datos = await new Promise((res,rej)=>{
    const r = new FileReader(); r.onload=()=>res(r.result); r.onerror=rej; r.readAsDataURL(file);
  });
  await fetch('/api/referencia_subida',{method:'POST',headers:{'Content-Type':'application/json'},
    body:JSON.stringify({nombre, datos})});
  render();
}

/* ---------------- paso 3: imagenes ---------------- */
function malasDe(escenas){
  return (escenas||[]).filter(e=>e.tiene_img && e.check &&
    !(e.check.texto_ok && e.check.estilo_ok && e.check.consistencia_ok));
}
async function pasoImagenes(){
  const r = ESTADO?.resumen || {};
  const falta = (r.planos||0) - (r.con_img||0);
  const coste = (falta*(r.precio_img||0)).toFixed(2);
  const malas = malasDe(ESTADO?.escenas);
  return cabecera('imagenes', 'Generar las imágenes del vídeo',
      `${r.planos||0} planos en total. ${falta? `Faltan ${falta}.` : 'Todas generadas.'}`) + `
    <div class="card">
      <div class="fila entre">
        <span class="chip ${falta?'mal':'ok'}">${falta? '~'+coste+' € estimados' : 'completo'}</span>
        <button class="p" ${(!falta||TRABAJANDO)?'disabled':''} onclick="generarImagenes()">
          Generar ${falta} imagen(es)
        </button>
      </div>
    </div>
    ${!falta && malas.length ? `
    <div class="card">
      <div class="fila entre">
        <b>${malas.length} plano(s) no pasaron el control</b>
        <span class="chip mal">tú decides si regenerarlos</span>
      </div>
      <p class="sub" style="margin:6px 0 14px">No se tocan solos. Marca los que quieras arreglar y dale a regenerar (usa el modelo más capaz, el doble de precio por imagen).</p>
      <div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:10px">
        ${malas.map(e=>`
          <label style="display:flex;flex-direction:column;gap:4px;cursor:pointer">
            <img src="/media/img/${e.id}?t=${Date.now()}" style="width:100%;border-radius:8px;border:2px solid var(--mal)">
            <div class="fila" style="font-size:11px;color:var(--suave)">
              <input type="checkbox" value="${e.id}" class="chkMala" style="width:auto">
              plano ${e.id}
            </div>
            <div style="font-size:11px;color:var(--suave)" title="${esc(e.check.nota||'')}">${esc((e.check.nota||'').slice(0,40))}</div>
          </label>`).join('')}
      </div>
      <div class="fila" style="margin-top:14px">
        <button class="sm" onclick="document.querySelectorAll('.chkMala').forEach(c=>c.checked=true)">Marcar todos</button>
        <button class="p" ${TRABAJANDO?'disabled':''} onclick="regenerarSeleccionadas()">Regenerar seleccionados</button>
      </div>
    </div>` : ''}
    ${(ESTADO?.escenas||[]).length ? `
    <div class="fila entre" style="margin:22px 0 12px">
      <b style="font-size:15px">Storyboard completo</b>
      <span class="chip">${r.con_img||0}/${r.planos||0} con imagen</span>
    </div>
    <div class="rejilla-planos">
      ${ESTADO.escenas.map(e=>`
        <div class="plano-card">
          <div class="lienzo">
            ${e.tiene_img ? `<img loading="lazy" src="/media/img/${e.id}?v=${e._v||0}" alt="">`
                          : `<span class="sin-img">sin imagen todavía</span>`}
            <span class="tag">#${String(e.id).padStart(3,'0')}</span>
            ${(e.avisos||[]).length ? `<span class="tag alerta" title="${esc(e.avisos.join(' · '))}">⚠</span>` : ''}
          </div>
          <div class="pie-plano">${esc(e.texto)}</div>
        </div>`).join('')}
    </div>` : ''}`;
}
async function generarImagenes(){
  const r = ESTADO?.resumen||{};
  const falta = (r.planos||0)-(r.con_img||0);
  const coste = (falta*(r.precio_img||0)).toFixed(2);
  if(!confirm(`¿Generar ${falta} imagen(es)? Coste aproximado: ~${coste} €.\n\nEsto no se puede deshacer sin volver a gastar.`)) return;
  await api('/api/imagenes');
}
async function regenerarSeleccionadas(){
  const ids = [...document.querySelectorAll('.chkMala:checked')].map(c=>parseInt(c.value));
  if(!ids.length) return avisar('Marca al menos un plano');
  const r = ESTADO?.resumen||{};
  const coste = (ids.length*(r.precio_img||0)*2).toFixed(2); // modelo mas capaz, ~2x precio
  if(!confirm(`¿Regenerar ${ids.length} plano(s)? Coste aproximado: ~${coste} €.`)) return;
  await api('/api/imagenes', {ids});
}

/* ---------------- paso 4: voz ---------------- */
async function pasoVoz(){
  const r = ESTADO?.resumen||{};
  const falta = (r.frases||0) - (r.con_audio||0);
  return cabecera('voz', 'Generar la voz narrada',
      `${r.frases||0} frases en total. ${falta? `Faltan ${falta}.` : 'Todas generadas.'}`) + `
    <div class="card">
      <div class="fila entre">
        <span class="chip ${falta?'mal':'ok'}">${falta? falta+' por generar' : 'completo'}</span>
        <button class="p" ${(!falta||TRABAJANDO)?'disabled':''} onclick="api('/api/voz')">Generar voz</button>
      </div>
    </div>`;
}

/* ---------------- paso 5: montaje ---------------- */
async function pasoMontaje(){
  const tieneVideo = ESTADO?.video;
  return cabecera('montaje', 'Montar el vídeo final',
      'Junta imágenes y voz en un único vídeo. Gratis, solo procesamiento local.') + `
    <div class="card">
      <button class="p" ${TRABAJANDO?'disabled':''} onclick="api('/api/montar',{forzar:false})">
        ${tieneVideo?'Rehacer vídeo':'Montar vídeo'}
      </button>
      ${tieneVideo? `<div style="margin-top:16px"><video controls src="/media/video?t=${Date.now()}"></video></div>` : ''}
    </div>`;
}

/* ---------------- paso 6: seo ---------------- */
async function pasoSeo(){
  const seo = await get('/api/seo');
  const punt = await get('/api/puntuar_seo');
  if(seo.__error) return cabecera('seo', 'Título, descripción y tags',
      'Genera primero el SEO a partir del guion.') +
    `<button class="p" ${TRABAJANDO?'disabled':''} onclick="api('/api/seo')">Generar SEO</button>`;
  const tieneNota = !punt.__error;
  const notaBlock = (campo,titulo)=> tieneNota ? `
      <div class="card">
        <div class="fila entre">
          <b>${titulo}</b>
          <span class="nota-grande ${notaClase(punt[campo].nota)}">${punt[campo].nota}</span>
        </div>
        <p style="margin:8px 0 0;color:var(--suave)">${esc(punt[campo].sugerencia)}</p>
      </div>` : '';
  return cabecera('seo', 'Título, descripción y tags', 'Puntuado como lo haría un plugin de SEO.') + `
    <div class="card">
      <label>Títulos sugeridos</label>
      ${(seo.titulos||[]).map(t=>`<div style="padding:6px 0">• ${esc(t)}</div>`).join('')}
      <label style="margin-top:14px">Descripción (gancho)</label>
      <div>${esc(seo.descripcion_gancho)}</div>
      <label style="margin-top:14px">Tags (${(seo.tags||[]).length})</label>
      <div style="color:var(--suave)">${esc((seo.tags||[]).join(', '))}</div>
    </div>
    <div class="fila" style="margin-bottom:16px">
      <button ${TRABAJANDO?'disabled':''} onclick="api('/api/seo')">Regenerar SEO</button>
      <button class="p" ${TRABAJANDO?'disabled':''} onclick="api('/api/puntuar_seo')">
        ${tieneNota?'Volver a puntuar':'Puntuar como vidIQ'}
      </button>
    </div>
    ${notaBlock('titulo','Título')}
    ${notaBlock('descripcion','Descripción')}
    ${notaBlock('tags','Tags')}`;
}

/* ---------------- paso 7: miniatura ---------------- */
async function pasoMiniatura(){
  const d = await get('/api/miniatura');
  const hay = d.miniaturas && d.miniaturas.length;
  const r = ESTADO?.resumen||{};
  const coste = (2*(r.precio_img||0)*2).toFixed(2); // 2 candidatas, modelo retry (2x precio base)
  return cabecera('miniatura', 'Miniatura',
      'Genera 2 variantes a partir del guion (mismas referencias/paleta del vídeo) y las puntúa como un plugin de CTR.') + `
    <div class="fila" style="margin-bottom:16px">
      <button class="p" ${TRABAJANDO?'disabled':''} onclick="generarMiniatura()">
        ${hay?'Generar otras 2':'Generar 2 miniaturas'} (~${coste} €)
      </button>
    </div>
    ${hay ? `<div class="miniaturas">${d.miniaturas.map(m=>`
      <div class="card">
        <img src="/media/miniatura/${encodeURIComponent(m.archivo)}?t=${Date.now()}">
        ${m.puntuacion ? `
          <div class="fila entre" style="margin-top:10px">
            <b>Nota</b><span class="nota-grande ${notaClase(m.puntuacion.nota)}">${m.puntuacion.nota}</span>
          </div>
          <p style="color:var(--suave);margin:6px 0 0">${esc(m.puntuacion.sugerencia)}</p>` : ''}
      </div>`).join('')}</div>` : ''}`;
}
async function generarMiniatura(){
  const r = ESTADO?.resumen||{};
  const coste = (2*(r.precio_img||0)*2).toFixed(2);
  if(!confirm(`¿Generar 2 miniaturas? Coste aproximado: ~${coste} €.`)) return;
  await api('/api/miniatura');
}

(async function iniciar(){
  await refrescar();
  await cargarProyectos();
  render();
  setInterval(async ()=>{ if(TRABAJANDO){ await refrescar(); } }, 2500);
})();
</script>
</body>
</html>
